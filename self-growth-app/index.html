<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self Growth</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <h1>Self Growth</h1>
</header>

<main id="panels">

  <section id="panel-home" class="panel" data-panel="home">
    <h2 class="visually-hidden">NEXT ACTION</h2>
    <div id="next-actions" class="next-actions"></div>

    <h2 class="section-title">TODAY</h2>
    <div id="today-body" class="today-row"></div>
    <div id="today-english" class="today-row"></div>
    <div id="today-growth" class="today-row"></div>
  </section>

  <section id="panel-body" class="panel" data-panel="body" hidden>
    <h2>BODY</h2>

    <form id="form-weight" class="quick-form">
      <label for="input-weight">体重 (kg)</label>
      <input id="input-weight" type="number" step="0.1" inputmode="decimal" required>
      <button type="submit">記録する</button>
    </form>

    <div class="quick-action">
      <button id="btn-body-action" type="button">今日の行動を記録</button>
      <input id="input-body-note" type="text" placeholder="メモ（任意）">
    </div>

    <p id="body-trend" class="trend-text"></p>

    <h3 class="sub-title">履歴</h3>
    <ul id="body-history" class="history-list"></ul>
  </section>

  <section id="panel-english" class="panel" data-panel="english" hidden>
    <h2>ENGLISH</h2>

    <form id="form-english-input" class="quick-form">
      <label>学習時間（分）</label>
      <input type="number" inputmode="numeric" required>
      <button type="submit">記録</button>
    </form>

    <form id="form-english-process" class="quick-form">
      <label>解いた問題数</label>
      <input type="number" inputmode="numeric" required>
      <button type="submit">記録</button>
    </form>

    <form id="form-english-output" class="quick-form">
      <label>模試スコア</label>
      <input type="number" inputmode="numeric" required>
      <button type="submit">記録</button>
    </form>

    <form id="form-english-outcome" class="quick-form">
      <label>本番 TOEIC スコア</label>
      <input type="number" inputmode="numeric" required>
      <button type="submit">記録</button>
    </form>

    <p class="hint-text">Input・Process・Outputは日々の行動、Outcomeは本番結果として別々に記録します。</p>

    <h3 class="sub-title">履歴</h3>
    <ul id="english-history" class="history-list"></ul>
  </section>

  <section id="panel-growth" class="panel" data-panel="growth" hidden>
    <h2>GROWTH</h2>

    <h3 class="sub-title">Active Project</h3>
    <div id="growth-active"></div>

    <h3 class="sub-title">Idea Inbox</h3>
    <form id="form-idea" class="quick-form">
      <input id="input-idea" type="text" placeholder="思いついたことを一言で" required>
      <button type="submit">追加</button>
    </form>
    <ul id="idea-list" class="history-list"></ul>
  </section>

</main>

<nav class="tabbar">
  <button data-tab="home" class="tab-btn is-active">HOME</button>
  <button data-tab="body" class="tab-btn">BODY</button>
  <button data-tab="english" class="tab-btn">ENGLISH</button>
  <button data-tab="growth" class="tab-btn">GROWTH</button>
</nav>

<script src="app.js"></script>
</body>
</html>
