<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Opening</title>
<!--
  オープニングの画面を HTML で組み、時刻 t を指定して1コマずつ描く。
  setTime(t) を呼ぶと、その時刻の見た目になる（リアルタイム再生はしない）。
  ?layer=all … 全部入りのプレビュー
  ?layer=<名前> … その層だけを透明背景で描く（ココフォリア用の書き出し）
-->
<style>
  @font-face { font-family: "Mincho"; src: url("../fonts/ShipporiMincho-Medium.ttf"); }
  @font-face { font-family: "Gothic"; src: url("../fonts/ZenKakuGothicNew-Medium.ttf"); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: transparent; }
  body.opaque { background: #040404; }
  .layer { position: absolute; inset: 0; }
  #bg { width: 1280px; height: 720px; }
  #gap { position: absolute; filter: blur(1.2px); }
  #grain { width: 1280px; height: 720px; opacity: .045; mix-blend-mode: screen; }

  #tagline { top: 590px; height: 100px; display: flex; flex-direction: column; align-items: center; gap: 10px;
             font-family: "Mincho"; font-size: 28px; color: #ded8d2; letter-spacing: .08em; }
  #tagline span { opacity: 0; }

  #title { left: 0; top: 0; }
  #title .main { position: absolute; top: 132px; right: 300px; writing-mode: vertical-rl;
                 font-family: "Gothic"; font-size: 58px; line-height: 1.32; letter-spacing: .04em; color: #eeece8; }
  #title .sub { position: absolute; top: 140px; right: 255px; writing-mode: vertical-rl; text-orientation: upright;
                font-family: "Gothic"; font-size: 19px; letter-spacing: .32em; color: #eeece8; }

  #card { left: 110px; top: 206px; width: 560px; font-family: "Mincho"; color: #e1dcd6; }
  #card .no { font-size: 22px; letter-spacing: .1em; }
  #card .head { font-size: 34px; margin-top: 18px; }
  #card .pos { font-size: 22px; margin-top: 14px; }
  #card .def { font-size: 24px; line-height: 1.7; margin-top: 16px; }
  #card .caret { display: inline-block; width: 2px; height: 1em; background: #e1dcd6; vertical-align: -0.12em; margin-left: 2px; }
</style>
</head>
<body>
<img id="bg" class="layer" src="../build/bg_placeholder.png">
<canvas id="gap" width="70" height="540"></canvas>
<div id="tagline" class="layer"><div></div><div></div></div>
<div id="title" class="layer">
  <div class="sub">クトゥルフ神話TRPG</div>
  <div class="main">暗闇の向こうに<br>誰も居ない事を<br>証明して下さい</div>
</div>
<div id="card" class="layer">
  <div class="no"></div><div class="head"></div><div class="pos"></div><div class="def"></div>
</div>
<canvas id="grain" class="layer" width="640" height="360"></canvas>

<script>
// ---- 秒割り（STORYBOARD.md の案A） ----
const T = {
  bgIn: [2.0, 3.6], tag: [5.0, 6.4], face: [6.0, 6.9], cut: 8.0,
  title: 8.6, titleDur: 1.4, card: 11.0, typeStep: 0.055,
};
const GAP = { x0: 470, x1: 540, y0: 150, y1: 690 };   // 背景のドアの隙間
const TAGLINE = ["それはどこにでも存在し、", "見つめれば形を成そうとする。"];

const params = new URLSearchParams(location.search);
const LAYER = params.get("layer") || "all";
const show = name => LAYER === "all" || LAYER === name;
if (LAYER === "all") document.body.classList.add("opaque");

const $ = s => document.querySelector(s);
const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };

// 同じ時刻なら毎回同じ模様になる乱数
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// 辞書カードの文面（シナリオ本文なので、外から window.EP として渡す）
let cardParts = [];
function setEpisode(ep) {
  cardParts = [[".no", ep.no], [".head", `■ ${ep.word}（${ep.kana}）`], [".pos", ep.pos], [".def", ep.def]];
}
window.setEpisode = setEpisode;

// 一文は1文字ずつ span にして、少しずつずらして浮かべる
const tagRows = [...document.querySelectorAll("#tagline > div")];
TAGLINE.forEach((line, r) => { tagRows[r].innerHTML = [...line].map(c => `<span>${c}</span>`).join(""); });

const gapCv = $("#gap");
Object.assign(gapCv.style, { left: GAP.x0 + "px", top: GAP.y0 + "px",
                             width: (GAP.x1 - GAP.x0) + "px", height: (GAP.y1 - GAP.y0) + "px" });
gapCv.width = GAP.x1 - GAP.x0; gapCv.height = GAP.y1 - GAP.y0;

function drawGap(t, frame, a) {
  const c = gapCv.getContext("2d"), w = gapCv.width, h = gapCv.height;
  const img = c.createImageData(w, h), r = rng(frame * 977 + 13);
  for (let i = 0; i < w * h; i++) {
    const v = 8 + r() * 22;
    img.data.set([v, v * .95, v * .92, 255 * a * (0.25 + r() * 0.35)], i * 4);
  }
  c.putImageData(img, 0, 0);
  // 一瞬だけ顔に見える3つの点
  const fa = ease((t - T.face[0]) / 0.3) * (1 - ease((t - (T.face[1] - 0.3)) / 0.3));
  if (fa > 0) {
    c.fillStyle = `rgba(40,37,35,${fa * 0.8})`;
    for (const [x, y, rad] of [[22, 180, 6], [49, 182, 6], [35, 228, 8]]) {
      c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }
  }
}

function drawGrain(frame) {
  const c = $("#grain").getContext("2d"), img = c.createImageData(640, 360), r = rng(frame * 31 + 7);
  for (let i = 0; i < 640 * 360; i++) { const v = r() * 255; img.data.set([v, v, v, 255], i * 4); }
  c.putImageData(img, 0, 0);
}

window.setTime = function (t, frame) {
  const before = t < T.cut;
  // 背景：暗闇から浮かび上がる
  const bgA = ease((t - T.bgIn[0]) / (T.bgIn[1] - T.bgIn[0]));
  $("#bg").style.display = show("bg") && before ? "" : "none";
  $("#bg").style.opacity = bgA;

  // 隙間のざらつきと顔
  gapCv.style.display = show("gap") && before ? "" : "none";
  if (show("gap") && before) drawGap(t, frame, bgA);

  // 一文：行ごと・文字ごとに少し遅れて浮かぶ
  $("#tagline").style.display = show("tagline") && before ? "" : "none";
  tagRows.forEach((row, r) => [...row.children].forEach((s, k) => {
    s.style.opacity = ease((t - T.tag[r] - k * 0.035) / 0.6);
  }));

  // タイトル：ぼやけた状態からくっきり
  const ta = ease((t - T.title) / T.titleDur);
  $("#title").style.display = show("title") && !before ? "" : "none";
  $("#title").style.opacity = ta;
  $("#title").style.filter = `blur(${(1 - ta) * 5}px)`;

  // 辞書カード：1文字ずつ打ち出す
  $("#card").style.display = show("card") && !before ? "" : "none";
  let n = Math.max(0, Math.floor((t - T.card) / T.typeStep) + (t >= T.card ? 1 : 0));
  const total = cardParts.reduce((s, [, txt]) => s + [...txt].length, 0);
  for (const [sel, txt] of cardParts) {
    const chars = [...txt], k = Math.max(0, Math.min(chars.length, n));
    $("#card " + sel).textContent = chars.slice(0, k).join("");
    n -= chars.length;
  }
  // 打ち終わったあとのカーソルは0.5秒ごとに点滅
  const typed = Math.floor((t - T.card) / T.typeStep) + 1;
  const caretOn = t >= T.card && (typed < total || Math.floor(t * 2) % 2 === 0);
  document.querySelectorAll("#card .caret").forEach(e => e.remove());
  if (caretOn) {
    const lastFilled = [...cardParts].reverse().find(([sel]) => $("#card " + sel).textContent);
    if (lastFilled) $("#card " + lastFilled[0]).insertAdjacentHTML("beforeend", '<span class="caret"></span>');
  }

  // 画面全体の粒子（プレビューのみ）
  $("#grain").style.display = LAYER === "all" ? "" : "none";
  if (LAYER === "all") drawGrain(frame);
};
window.TIMING = T;
</script>
</body>
</html>
